<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Login – PillBox</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --teal: #0d9488; --teal-light: #14b8a6; --teal-dark: #0f766e;
            --bg: #0f172a; --card: #1e293b; --border: #334155;
            --text: #f1f5f9; --muted: #94a3b8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo-row {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 48px; height: 48px;
            background: var(--teal);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
        }
        .logo-text h1 { font-size: 1.1rem; font-weight: 700; }
        .logo-text p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

        h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
        .subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 28px; }

        .alert {
            padding: 10px 14px; border-radius: 8px;
            font-size: 0.85rem; font-weight: 500; margin-bottom: 18px;
            background: rgba(220,38,38,0.15); color: #f87171;
            border: 1px solid rgba(220,38,38,0.3);
        }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.83rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
        .form-group input {
            width: 100%; padding: 12px 16px;
            background: var(--bg); border: 1.5px solid var(--border);
            border-radius: 10px; color: var(--text);
            font-size: 0.95rem; outline: none;
            transition: border-color 0.15s;
            font-family: inherit;
        }
        .form-group input:focus { border-color: var(--teal); }
        .form-group input::placeholder { color: #475569; }

        .btn-login {
            width: 100%; padding: 14px;
            background: var(--teal); color: white;
            border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background 0.18s;
            font-family: inherit; margin-top: 8px;
        }
        .btn-login:hover { background: var(--teal-light); }

        .back-link { text-align: center; margin-top: 20px; font-size: 0.83rem; color: var(--muted); }
        .back-link a { color: var(--teal); font-weight: 600; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-row">
            <div class="logo-icon">🚚</div>
            <div class="logo-text">
                <h1>PillBox Delivery</h1>
                <p>Portal Access</p>
            </div>
        </div>

        <h2>Sign In</h2>
        <p class="subtitle">Enter your delivery team credentials to continue.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('delivery_login') }}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="your username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Sign In →</button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('index') }}">← Back to Store</a>
        </div>
    </div>
</body>
</html>
