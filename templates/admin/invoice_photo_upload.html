<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Invoice Photo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --purple: #7B2FBE; --purple-dark: #561F87; --green: #16a34a; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2eef8; color: #1a1230; padding: 20px; }
        .wrap { max-width: 440px; margin: 0 auto; }
        .head { background: linear-gradient(135deg, var(--purple-dark), var(--purple)); color: #fff; border-radius: 16px; padding: 22px; margin-bottom: 18px; }
        .head h1 { font-size: 1.2rem; }
        .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 2px 10px rgba(30,20,60,.1); }
        .pick { display: block; width: 100%; background: var(--purple); color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
        .pick.secondary { background: #fff; color: var(--purple); border: 2px solid var(--purple); }
        #camInput, #fileInput { display: none; }
        .preview { margin: 14px 0; } .preview img { width: 100%; border-radius: 12px; }
        .send { display: block; width: 100%; background: var(--green); color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 1.05rem; font-weight: 800; cursor: pointer; }
        .send:disabled { opacity: .5; }
        .msg { text-align: center; font-weight: 700; margin-top: 14px; min-height: 22px; }
        .msg.ok { color: var(--green); } .msg.err { color: #dc2626; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="head"><h1>📷 Invoice Photo</h1><p style="font-size:.85rem;opacity:.9;">Take a clear photo of the invoice.</p></div>
    <div class="card">
        <input type="file" id="camInput" accept="image/*" capture="environment" onchange="pick(this.files[0])">
        <input type="file" id="fileInput" accept="image/*" onchange="pick(this.files[0])">
        <button class="pick" onclick="document.getElementById('camInput').click()">📸 Take Photo</button>
        <button class="pick secondary" onclick="document.getElementById('fileInput').click()">🖼️ Choose from Gallery</button>
        <div class="preview" id="preview"></div>
        <button class="send" id="sendBtn" onclick="upload()" disabled>Upload Invoice</button>
        <div class="msg" id="msg"></div>
    </div>
</div>
<script>
    const INV_ID = "{{ invoice_id }}", TOKEN = "{{ token }}";
    let file = null;
    function pick(f) {
        if (!f) return; file = f;
        document.getElementById('preview').innerHTML = `<img src="${URL.createObjectURL(f)}">`;
        document.getElementById('sendBtn').disabled = false;
    }
    function upload() {
        const btn = document.getElementById('sendBtn'), msg = document.getElementById('msg');
        btn.disabled = true; btn.textContent = 'Uploading…';
        const fd = new FormData(); fd.append('token', TOKEN); fd.append('photo', file);
        fetch(`/invoice-photo/${INV_ID}`, { method: 'POST', body: fd })
            .then(r => r.json()).then(d => {
                if (d.success) { msg.className = 'msg ok'; msg.textContent = '✓ Uploaded! You can close this and refresh the invoice on your computer.'; btn.textContent = 'Done'; }
                else { msg.className = 'msg err'; msg.textContent = d.message || 'Failed.'; btn.disabled = false; btn.textContent = 'Try Again'; }
            }).catch(() => { msg.className = 'msg err'; msg.textContent = 'Network error.'; btn.disabled = false; btn.textContent = 'Try Again'; });
    }
</script>
</body>
</html>
